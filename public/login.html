<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Accedi · Pragma</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="./" aria-label="Pragma"><span class="brand-mark">P</span><span>pragma</span></a>
    <p class="eyebrow">AREA AMMINISTRATIVA</p>
    <h1>Accedi a Pragma</h1>
    <p class="login-subtitle">Inserisci le credenziali amministrative per continuare.</p>
    <form id="login-form" method="post" action="api/auth/login">
      <label>Nome utente<input name="username" required autocomplete="username" autofocus></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button class="button primary" type="submit">Accedi</button>
    </form>
  </main>
</body>
</html>
